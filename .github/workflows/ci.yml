name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.lock
          npm --prefix frontend ci
          npm --prefix swarm ci
          npm --prefix xrpl ci
      - name: Build frontend and Swarm
        run: |
          npm --prefix frontend run build
          npm --prefix swarm run build
      - name: Test without provider credentials
        run: |
          python -m pytest -q -c backend/pytest.ini backend/tests
          node --test --test-concurrency=1 frontend/src/*.test.js
          npm --prefix swarm test
          npm --prefix xrpl run check
          npm --prefix xrpl test
          python -m pip check
